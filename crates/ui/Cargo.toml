[package]
name = "ui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Glintworks"]
homepage = "https://glintworks.studio"

[dependencies]
vizia = { workspace = true }
engine = { path = "../engine" }
chip = { path = "../chip" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
# common-controls-v6: the save prompt's Save / Don't Save / Cancel buttons
# (a task dialog; the binaries embed the manifest it needs, see build.rs).
rfd = { version = "0.18", features = ["common-controls-v6"] }
# EBU R128 loudness for the export's loudness option (MIT; pre-approved, STABILIZE_PROMPT.md).
ebur128 = "0.1.11"
# Native menu bar for the standalone app (MIT OR Apache-2.0; FEASIBILITY.md §1).
# Optional so a plugin build can leave it out.
muda = { version = "0.22", default-features = false, optional = true }
# The main window's native handle for the menu bar (already in the tree via
# winit, rfd and muda; MIT OR Apache-2.0 OR Zlib).
raw-window-handle = "0.6"

# Dark popup menus (Settings > Display > Dark menus; docs/design/DARK-MENUS.md):
# owner-drawn items through documented Win32 calls. Already in the tree via
# muda and winit (MIT OR Apache-2.0); the version muda uses.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["menus"]
menus = ["dep:muda", "dep:windows-sys"]
