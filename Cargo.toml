[workspace]
resolver = "2"
members = ["crates/chip", "crates/ui", "crates/app"]

[workspace.dependencies]
vizia = "0.4.0"

[profile.release]
debug = false

# Release + full debug info, for sampling profilers (samply / WPR).
# Usage: cargo build --profile profiling -p app
[profile.profiling]
inherits = "release"
debug = true

# vizia fork: tag 0.4.0 + seven focused commits (six perf fixes, one frame-rate limit) (branch `chipdaw-perf` on
# https://github.com/jeffreyfrederick/vizia), kept upstream-ready. See PERF.md for
# the commit list. Pinned to an exact commit; to hack on a local checkout, swap
# these for `path = "../vizia/..."` entries.
[patch.crates-io]
vizia = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_core = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_winit = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_style = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_reactive = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_storage = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_input = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_window = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
vizia_id = { git = "https://github.com/jeffreyfrederick/vizia", rev = "40ef8cfeaefaa09c77171375e037ca04c99e065a" }
