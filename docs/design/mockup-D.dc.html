<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option D: current palette, graphite toggles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:1440px;height:400px;background:linear-gradient(180deg,#191919,#0A0A0A);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#E6E6E6;display:flex;flex-direction:column;overflow:hidden">

<div style="height:76px;flex:none;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(180deg,#191919,#0A0A0A);border-top:1px solid #323232;border-bottom:1px solid #1A1A1A">

<div style="display:flex;align-items:center;gap:12px">
<div role="group" aria-label="View" style="display:flex;gap:8px">
<button aria-label="Arrangement view" aria-pressed="true" style="width:40px;height:40px;border-radius:8px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="18" height="14" viewBox="0 0 18 14" style="filter:drop-shadow(0 0 3px rgba(199,215,78,.55))"><rect x="1" y="1.5" width="9" height="3" rx="0.5" fill="#C7D74E"/><rect x="5" y="5.5" width="12" height="3" rx="0.5" fill="#C7D74E"/><rect x="2" y="9.5" width="7" height="3" rx="0.5" fill="#C7D74E"/></svg><span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span></button>
<button aria-label="Mixer view" aria-pressed="false" style="width:40px;height:40px;border-radius:8px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0"><svg aria-hidden="true" width="18" height="16" viewBox="0 0 18 16"><path d="M3 1V15M9 1V15M15 1V15" stroke="#8C8C8C" stroke-width="1.5" stroke-linecap="round"/><rect x="1" y="9" width="4" height="3" rx="0.5" fill="#8C8C8C"/><rect x="7" y="4" width="4" height="3" rx="0.5" fill="#8C8C8C"/><rect x="13" y="7" width="4" height="3" rx="0.5" fill="#8C8C8C"/></svg><span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span></button>
</div>
<div style="width:1px;height:28px;background:#323232"></div>
<div role="group" aria-label="Transport" style="display:flex;gap:8px">
<sc-for list="{{transport}}" as="k" hint-placeholder-count="4">
<button aria-label="{{k.label}}" style="width:40px;height:40px;border-radius:8px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0">
<sc-if value="{{k.play}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="14" viewBox="0 0 12 14"><path d="M1 1L11 7L1 13Z" fill="#D6D6D6"/></svg></sc-if>
<sc-if value="{{k.stop}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="10" height="10" rx="1.5" fill="#D6D6D6"/></svg></sc-if>
<sc-if value="{{k.rec}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="#B9534C" stroke-width="2"/></svg></sc-if>
<sc-if value="{{k.loop}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="18" height="14" viewBox="0 0 18 14"><path d="M4 4H13a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3" fill="none" stroke="#D6D6D6" stroke-width="1.8" stroke-linecap="round"/><path d="M5 1.5L3 4L5 6.5" fill="none" stroke="#D6D6D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if>
<span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span>
</button>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px">
<div style="position:relative;width:560px;height:56px;box-sizing:border-box;border-radius:8px;background:#151515;border:1px solid #323232;box-shadow:{{wellShadow}};display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden">
<div style="display:flex;align-items:center">
<div role="img" aria-label="Playing, loop on, 48 kHz, 24-bit" style="width:72px;height:54px;display:grid;grid-template-columns:auto auto;column-gap:8px;row-gap:8px;align-content:center;justify-content:center;align-items:center;justify-items:center">
<svg aria-hidden="true" width="12" height="14" viewBox="0 0 12 14" style="filter:drop-shadow(0 0 3px rgba(199,215,78,.65))"><path d="M1 1L11 7L1 13Z" fill="#C7D74E"/></svg>
<svg aria-hidden="true" width="18" height="14" viewBox="0 0 18 14" style="filter:drop-shadow(0 0 3px rgba(199,215,78,.65))"><path d="M4 4H13a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3" fill="none" stroke="#C7D74E" stroke-width="1.8" stroke-linecap="round"/><path d="M5 1.5L3 4L5 6.5" fill="none" stroke="#C7D74E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font:700 11px Inter,sans-serif;line-height:12px;color:#C7D74E;text-shadow:0 0 6px rgba(199,215,78,.75)">48k</span>
<span style="font:700 11px Inter,sans-serif;line-height:12px;color:#C7D74E;text-shadow:0 0 6px rgba(199,215,78,.75)">24-bit</span>
</div>
<div aria-hidden="true" style="width:1px;height:32px;background:#2A2A2A;margin:0 8px"></div>
<div style="width:96px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><div style="font:600 20px Inter,sans-serif;line-height:20px;color:#EDEDED">0:42.18</div><div style="font:600 10px Inter,sans-serif;line-height:12px;letter-spacing:.1em;color:#808080">TIME</div></div>
<div aria-hidden="true" style="width:1px;height:32px;background:#2A2A2A;margin:0 8px"></div>
<div style="width:80px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><div style="font:600 18px 'JetBrains Mono',monospace;line-height:20px;color:#EDEDED">17.2.3</div><div style="font:600 10px Inter,sans-serif;line-height:12px;letter-spacing:.1em;color:#808080">POSITION</div></div>
<div aria-hidden="true" style="width:1px;height:32px;background:#2A2A2A;margin:0 8px"></div>
<div style="width:64px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><div style="font:600 18px 'JetBrains Mono',monospace;line-height:20px;color:#EDEDED">9.1.1</div><div style="font:600 10px Inter,sans-serif;line-height:12px;letter-spacing:.1em;color:#808080">START</div></div>
<div aria-hidden="true" style="width:1px;height:32px;background:#2A2A2A;margin:0 8px"></div>
<div style="width:64px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><div style="font:600 18px 'JetBrains Mono',monospace;line-height:20px;color:#EDEDED">2.0.0</div><div style="font:600 10px Inter,sans-serif;line-height:12px;letter-spacing:.1em;color:#808080">LENGTH</div></div>
<div aria-hidden="true" style="width:1px;height:32px;background:#2A2A2A;margin:0 8px"></div>
<div style="width:64px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><div style="font:600 20px Inter,sans-serif;line-height:20px;color:#EDEDED">150.00</div><div style="font:600 10px Inter,sans-serif;line-height:12px;letter-spacing:.1em;color:#808080">BPM</div></div>
</div>
<div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;border-radius:7px;background:linear-gradient(180deg,rgba(0,0,0,.78) 0px,rgba(0,0,0,.5) 8px,rgba(0,0,0,.28) 18px,rgba(0,0,0,.12) 26px,rgba(0,0,0,0) 34px);box-shadow:inset 0 14px 16px -10px rgba(0,0,0,.95)"></div>
</div>
<button style="height:56px;width:56px;border-radius:8px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);position:relative;overflow:hidden;color:#C8C8C8;font:700 11px Inter,sans-serif;letter-spacing:.08em;padding:0">TAP<span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span></button>
</div>

<div style="display:flex;align-items:center;gap:12px">
<div aria-label="Spectrum of the mix" role="img" style="position:relative;width:216px;height:56px;box-sizing:border-box;border-radius:8px;background:#151515;border:1px solid #323232;box-shadow:{{wellShadow}};display:flex;align-items:flex-end;gap:4px;padding:0 12px 8px;overflow:hidden">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="24">
<div style="width:4px;flex:none;display:flex;flex-direction:column;justify-content:flex-end;gap:4px">
<div style="height:2px;background:#C8C8C8;opacity:.55"></div>
<div style="height:{{b.h}}px;background:linear-gradient(0deg,#4A4A4A 0%,#9A9A9A 60%,#D6D6D6 100%)"></div>
</div>
</sc-for>
</div>
<div style="display:grid;grid-template-columns:auto auto;column-gap:12px;row-gap:8px;font:600 11px Inter,sans-serif;letter-spacing:.06em;line-height:12px">
<div style="color:#808080">CPU</div><div style="color:#E6E6E6;text-align:right">4%</div>
<div style="color:#808080">MEM</div><div style="color:#E6E6E6;text-align:right">212 MB</div>
</div>
</div>
</div>

<div style="height:28px;flex:none;display:flex;background:#0F0F0F;box-shadow:inset 0 -1px 0 #1E1E1E">
<div style="width:380px;flex:none;box-sizing:border-box;padding-left:16px;display:flex;align-items:center;font:600 11px Inter,sans-serif;letter-spacing:.08em;color:#808080;box-shadow:inset -1px 0 0 #1E1E1E">TRACKS</div>
<div style="position:relative;flex:1;display:flex">
<sc-for list="{{ruler}}" as="r" hint-placeholder-count="11">
<div style="width:100px;flex:none;box-sizing:border-box;height:28px;box-shadow:inset 1px 0 0 #3A3A3A;padding:8px 0 0 4px;font:500 11px Inter,sans-serif;line-height:12px;color:#808080;background:repeating-linear-gradient(90deg,transparent 0 24px,#3A3A3A 24px 25px) left bottom / 100% 8px no-repeat,repeating-linear-gradient(90deg,transparent 0 5.25px,#262626 5.25px 6.25px) left bottom / 100% 4px no-repeat">{{r.n}}</div>
</sc-for>
<svg role="img" aria-label="Playhead" width="12" height="14" viewBox="0 0 12 14" style="position:absolute;left:455px;top:10px;overflow:visible"><path d="M1 0.5H11V7.5L6 13L1 7.5Z" fill="#E6E6E6" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/><path d="M6 13V18" stroke="#E6E6E6" stroke-width="1"/></svg>
<div aria-label="Loop, bars 1 to 9" role="img" style="position:absolute;left:0;top:0;width:800px;height:4px;background:linear-gradient(180deg,#D3E05E,#A9B83A);box-shadow:0 0 6px rgba(199,215,78,.45)"></div>
</div>
</div>

<sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
<div style="height:72px;flex:none;display:flex;border-bottom:1px solid #1A1A1A">
<div style="width:380px;flex:none;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 12px 0 0;background:#0A0A0A;box-shadow:inset -1px 0 0 #1E1E1E">
<div style="width:16px;align-self:stretch;flex:none;box-sizing:border-box;background:{{t.stripBg}};border-left:1px solid {{t.stripLight}};border-right:1px solid {{t.stripDark}};box-shadow:{{t.stripShadow}}"></div>
<div aria-hidden="true" style="width:28px;flex:none;text-align:center;font:italic 800 40px Inter,sans-serif;line-height:40px;color:#222222;letter-spacing:-.02em">{{t.num}}</div>
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
<div style="font:600 14px Inter,sans-serif;color:#E6E6E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{t.name}}</div>
<div style="display:flex;align-items:center;gap:8px;min-width:0">
<span style="flex:none;display:inline-flex;align-items:center;gap:4px;height:16px;padding:0 4px;border:1px solid #323232;border-radius:4px;font:600 11px Inter,sans-serif;color:#A8A8A8"><svg aria-hidden="true" width="9" height="11" viewBox="0 0 9 11"><rect x="0.5" y="4.5" width="8" height="6" rx="1.2" fill="#A8A8A8"/><path d="M2.3 4.5V3a2.2 2.2 0 0 1 4.4 0v1.5" fill="none" stroke="#A8A8A8" stroke-width="1.2"/></svg>{{t.chip}}</span>
<span style="font:500 12px Inter,sans-serif;color:#808080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">{{t.preset}}</span>
</div>
</div>
<div style="width:120px;flex:none;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:8px;justify-content:flex-end">
<button style="position:relative;width:24px;height:24px;border-radius:4px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);font:700 12px Inter,sans-serif;padding:0;overflow:hidden;color:{{t.muteColor}};text-shadow:{{t.muteGlow}}">M<span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span></button>
<button style="position:relative;width:24px;height:24px;border-radius:4px;border:1px solid #383838;background:linear-gradient(180deg,#161616,#424242);font:700 12px Inter,sans-serif;padding:0;overflow:hidden;color:{{t.soloColor}};text-shadow:{{t.soloGlow}}">S<span aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,#3E3E3E,#999999 50%,#3A3A3A)"></span></button>
</div>
<div style="display:flex;gap:12px;align-items:center">
<div role="slider" aria-label="Volume" aria-valuetext="{{t.volText}}" style="position:relative;width:68px;height:4px;background:#050505;box-shadow:inset 0 1px 0 #000,0 1px 0 #262626">
<div style="position:absolute;left:0;top:0;bottom:0;width:{{t.meterPx}}px;background:linear-gradient(90deg,#2F6FD6 0px,#2FB7B0 22px,#C7D74E 44px,#F0A23A 56px,#E0483B 68px) left top / 68px 100% no-repeat"></div>
<div style="position:absolute;top:-4px;width:8px;height:12px;box-sizing:border-box;border-radius:0;border:1px solid #4A4A4A;background:linear-gradient(180deg,#5A5A5A,#2E2E2E);box-shadow:inset 0 1px 0 #A0A0A0;left:{{t.volThumb}}px"></div>
</div>
<div role="slider" aria-label="Pan" aria-valuetext="{{t.panText}}" style="position:relative;width:40px;height:4px;background:#050505;box-shadow:inset 0 1px 0 #000,0 1px 0 #262626">
<div style="position:absolute;left:19.5px;top:-2px;width:1px;height:8px;background:#4A4A4A"></div>
<div style="position:absolute;top:0;bottom:0;left:{{t.panFillLeft}}px;width:{{t.panFillW}}px;background:#8A8A8A"></div>
<div style="position:absolute;top:-4px;width:8px;height:12px;box-sizing:border-box;border-radius:0;border:1px solid #4A4A4A;background:linear-gradient(180deg,#5A5A5A,#2E2E2E);box-shadow:inset 0 1px 0 #A0A0A0;left:{{t.panThumb}}px"></div>
</div>
</div>
</div>
</div>
<div style="position:relative;flex:1;background:repeating-linear-gradient(90deg,#262626 0 1px,transparent 1px 100px),repeating-linear-gradient(90deg,#1D1D1D 0 1px,transparent 1px 25px),{{t.rowBg}}">
<sc-for list="{{t.clipList}}" as="c" hint-placeholder-count="2">
<div style="position:absolute;top:2px;bottom:2px;left:{{c.left}}px;width:{{c.width}}px;box-sizing:border-box;border-radius:4px;overflow:hidden;background:{{c.body}};border:1px solid {{c.edge}}">
<div style="height:16px;background:{{c.head}};padding:0 8px;font:600 11px Inter,sans-serif;line-height:16px;color:#111111">{{c.name}}</div>
</div>
</sc-for>
<div style="position:absolute;top:0;bottom:0;left:800px;width:200px;background:rgba(255,255,255,.045);border-left:1px solid rgba(255,255,255,.14);border-right:1px solid rgba(255,255,255,.14)"></div>
<div style="position:absolute;top:0;bottom:0;left:460px;width:1px;background:#E6E6E6;opacity:.85"></div>
</div>
</div>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const toggle = '#C7D74E';
    const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const mix = (hex, t, toWhite) => {
      const target = toWhite ? 255 : 0;
      return '#' + parse(hex).map((v) => Math.round(v + (target - v) * t).toString(16).padStart(2, '0')).join('');
    };
    const rgba = (hex, a) => { const c = parse(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; };
    const bar = 100;
    const off = '#9A9A9A';
    const raw = [
      { name: 'Pulse 1', preset: 'Square Lead', chip: '2A03', color: '#C9D24A', lit: true, mute: false, solo: false, vol: 0.78, level: 0.82, pan: 0, clips: [[0, 4, 'Intro Lead'], [4, 4, 'Hook A'], [8, 3, 'Hook B']] },
      { name: 'Triangle', preset: 'Triangle Bass', chip: '2A03', color: '#7F86E0', lit: true, mute: false, solo: true, vol: 0.86, level: 0.9, pan: -0.25, clips: [[0, 8, 'Bassline'], [8, 3, 'Walk Down']] },
      { name: 'Noise', preset: 'Standard Kit', chip: '2A03', color: '#B5AC98', lit: false, mute: true, solo: false, vol: 0.64, level: 0, pan: 0.3, clips: [[2, 6, 'Groove'], [8, 3, 'Fill']] },
      { name: 'VRC6 Pulse 1', preset: 'Cello', chip: 'VRC6', color: '#D9579A', lit: true, mute: false, solo: false, vol: 0.7, level: 0.75, pan: 0.5, clips: [[4, 7, 'Strings']] }
    ];
    const glow = '0 0 6px ' + rgba(toggle, 0.85) + ', 0 0 2px ' + rgba(toggle, 0.9);
    const tracks = raw.map((t, i) => ({
      ...t,
      num: i + 1,
      volPx: Math.round(t.vol * 68),
      volThumb: Math.round(t.vol * 68) - 4,
      meterPx: t.mute ? 0 : Math.round(t.vol * 68 * t.level),
      volText: (20 * Math.log10(t.vol)).toFixed(1) + ' dB',
      panThumb: Math.round(20 + t.pan * 20) - 4,
      panFillLeft: t.pan < 0 ? Math.round(20 + t.pan * 20) : 20,
      panFillW: Math.round(Math.abs(t.pan) * 20),
      panText: t.pan === 0 ? 'Centre' : Math.round(Math.abs(t.pan) * 50) + (t.pan < 0 ? 'L' : 'R'),
      rowBg: i % 2 ? '#141414' : '#171717',
      stripBg: t.lit
        ? 'linear-gradient(90deg,' + t.color + ' 0%,' + mix(t.color, 0.35, true) + ' 55%,' + mix(t.color, 0.7, true) + ' 100%)'
        : 'linear-gradient(90deg,' + mix(t.color, 0.62, false) + ' 0%,' + mix(t.color, 0.35, false) + ' 100%)',
      stripLight: t.lit ? mix(t.color, 0.6, true) : mix(t.color, 0.2, false),
      stripDark: mix(t.color, 0.5, false),
      stripShadow: t.lit ? 'inset 0 0 10px rgba(255,255,255,.55), 0 0 10px ' + rgba(t.color, 0.35) : 'none',
      muteColor: t.mute ? toggle : off,
      muteGlow: t.mute ? glow : 'none',
      soloColor: t.solo ? toggle : off,
      soloGlow: t.solo ? glow : 'none',
      clipList: t.clips.map(([s, l, n]) => ({
        name: n,
        left: s * bar + 2,
        width: l * bar - 4,
        head: t.color,
        body: 'linear-gradient(180deg,' + rgba(t.color, 0.22) + ' 0%,' + rgba(t.color, 0.1) + ' 100%)',
        edge: rgba(t.color, 0.5)
      }))
    }));
    const hs = [16, 24, 32, 28, 20, 36, 28, 24, 20, 24, 28, 32, 36, 28, 20, 16, 24, 24, 20, 12, 16, 12, 8, 4];
    const bars = hs.map((h) => ({ h: h }));
    const ruler = Array.from({ length: 11 }, (_, i) => ({ n: i + 1 }));
    const transport = [
      { label: 'Play', play: true },
      { label: 'Stop', stop: true },
      { label: 'Record', rec: true },
      { label: 'Loop', loop: true }
    ];
    return {
      tracks: tracks,
      bars: bars,
      ruler: ruler,
      transport: transport,
      wellShadow: 'inset 0 -1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.04)'
    };
  }
}
</script>
</body>
</html>
